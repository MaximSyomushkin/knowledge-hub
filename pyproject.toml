[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledgehub"
version = "2.0.0"
description = "School hub for an Obsidian vault: lecture hubs, tasks and events, ideas, digests and reminders"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
khub = "knowledgehub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "hermes_plugin/tests"]
markers = ["server: hits the real local llama-server (run with -m server)"]
addopts = "-m \"not server\""
