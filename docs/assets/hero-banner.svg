<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Knowledge Hub banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="60%" stop-color="#111723"/>
      <stop offset="100%" stop-color="#16142A"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx="0.78" cy="0.45" r="0.38">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.92" cy="0.72" r="0.30">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363D" opacity="0.55"/>
    </pattern>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="65%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="url(#bg)" stroke="#30363D" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="296" rx="17" fill="url(#dots)"/>
  <rect x="2" y="2" width="1196" height="296" rx="17" fill="url(#glowPurple)"/>
  <rect x="2" y="2" width="1196" height="296" rx="17" fill="url(#glowCyan)"/>

  <!-- Eyebrow pill -->
  <rect x="52" y="42" width="332" height="28" rx="14" fill="#1F2937" stroke="#3B4252" stroke-width="1"/>
  <circle cx="70" cy="56" r="4.5" fill="#3FB950"/>
  <text x="84" y="60.5" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.0">OBSIDIAN · DISCORD · TELEGRAM · HERMES</text>

  <!-- Title & subtitle -->
  <text x="52" y="132" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.2">Knowledge Hub</text>
  <text x="52" y="168" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18.5" font-weight="400">Auto-linked lecture graphs, chat-captured tasks &amp; ideas, and scheduled</text>
  <text x="52" y="194" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18.5" font-weight="400">digests for a student's Obsidian vault — mixing local tools &amp; cloud AI.</text>

  <!-- Feature pills -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
    <rect x="52" y="226" width="128" height="32" rx="8" fill="#1E1B3A" stroke="#7C3AED" stroke-width="1"/>
    <circle cx="70" cy="242" r="4" fill="#A78BFA"/>
    <text x="82" y="246.5" fill="#DDD6FE">Lecture Hubs</text>

    <rect x="192" y="226" width="140" height="32" rx="8" fill="#10253A" stroke="#0284C7" stroke-width="1"/>
    <circle cx="210" cy="242" r="4" fill="#38BDF8"/>
    <text x="222" y="246.5" fill="#BAE6FD">Tasks &amp; Events</text>

    <rect x="344" y="226" width="114" height="32" rx="8" fill="#2A2010" stroke="#D97706" stroke-width="1"/>
    <circle cx="362" cy="242" r="4" fill="#FBBF24"/>
    <text x="374" y="246.5" fill="#FDE68A">Idea Notes</text>

    <rect x="470" y="226" width="164" height="32" rx="8" fill="#0F291E" stroke="#16A34A" stroke-width="1"/>
    <circle cx="488" cy="242" r="4" fill="#4ADE80"/>
    <text x="500" y="246.5" fill="#BBF7D0">Digests &amp; Alerts</text>
  </g>

  <!-- Right-side stylized Obsidian node graph -->
  <g transform="translate(760, 26)">
    <!-- Subtle backdrop panel -->
    <rect x="0" y="0" width="388" height="248" rx="14" fill="#0B0F17" fill-opacity="0.72" stroke="#262E3D" stroke-width="1"/>
    <text x="18" y="24" fill="#64748B" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" letter-spacing="0.8">VAULT GRAPH · LIVE SYNC</text>
    <circle cx="364" cy="20" r="4" fill="#3FB950"/>

    <!-- Graph edges -->
    <g stroke-width="1.6" fill="none">
      <!-- Course hub to lectures -->
      <line x1="194" y1="78" x2="88" y2="150" stroke="#7C3AED" stroke-opacity="0.75"/>
      <line x1="194" y1="78" x2="194" y2="156" stroke="#7C3AED" stroke-opacity="0.85"/>
      <line x1="194" y1="78" x2="300" y2="150" stroke="#7C3AED" stroke-opacity="0.75"/>
      <!-- Lecture chain -->
      <line x1="88" y1="150" x2="194" y2="156" stroke="#38BDF8" stroke-width="2.2"/>
      <line x1="194" y1="156" x2="300" y2="150" stroke="#38BDF8" stroke-width="2.2"/>
      <!-- Orbiting sheets -->
      <line x1="88" y1="150" x2="46" y2="198" stroke="#475569"/>
      <line x1="88" y1="150" x2="104" y2="208" stroke="#475569"/>
      <line x1="194" y1="156" x2="164" y2="212" stroke="#475569"/>
      <line x1="194" y1="156" x2="226" y2="212" stroke="#475569"/>
      <line x1="300" y1="150" x2="284" y2="208" stroke="#475569"/>
      <line x1="300" y1="150" x2="342" y2="198" stroke="#475569"/>
      <!-- Memory & Ideas accent links -->
      <line x1="194" y1="78" x2="76" y2="74" stroke="#334155" stroke-dasharray="4 4"/>
      <line x1="194" y1="78" x2="314" y2="74" stroke="#334155" stroke-dasharray="4 4"/>
    </g>

    <!-- Secondary nodes: Memory & Ideas -->
    <circle cx="76" cy="74" r="9" fill="#0F291E" stroke="#4ADE80" stroke-width="2"/>
    <text x="76" y="56" text-anchor="middle" fill="#86EFAC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">memory.md</text>

    <circle cx="314" cy="74" r="9" fill="#2A2010" stroke="#FBBF24" stroke-width="2"/>
    <text x="314" y="56" text-anchor="middle" fill="#FDE68A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Ideas/</text>

    <!-- Course Hub center node -->
    <circle cx="194" cy="78" r="18" fill="#8B5CF6" fill-opacity="0.22"/>
    <circle cx="194" cy="78" r="12" fill="#A78BFA" stroke="#EDE9FE" stroke-width="2"/>
    <text x="194" y="52" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">Course Hub</text>

    <!-- Lecture chain nodes -->
    <circle cx="88" cy="150" r="10" fill="#0EA5E9" stroke="#E0F2FE" stroke-width="1.8"/>
    <text x="88" y="133" text-anchor="middle" fill="#BAE6FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Lec 1</text>

    <circle cx="194" cy="156" r="11" fill="#0EA5E9" stroke="#E0F2FE" stroke-width="2"/>
    <text x="194" y="138" text-anchor="middle" fill="#F0F9FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700">Lec 2</text>

    <circle cx="300" cy="150" r="10" fill="#0EA5E9" stroke="#E0F2FE" stroke-width="1.8"/>
    <text x="300" y="133" text-anchor="middle" fill="#BAE6FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Lec 3</text>

    <!-- Sheet satellite dots -->
    <g fill="#94A3B8" stroke="#1E293B" stroke-width="1.5">
      <circle cx="46" cy="198" r="5.5"/>
      <circle cx="104" cy="208" r="5.5"/>
      <circle cx="164" cy="212" r="5.5"/>
      <circle cx="226" cy="212" r="5.5"/>
      <circle cx="284" cy="208" r="5.5"/>
      <circle cx="342" cy="198" r="5.5"/>
    </g>
    <text x="194" y="234" text-anchor="middle" fill="#64748B" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5">notes · study · practical · mynotes · pdf</text>
  </g>
</svg>
